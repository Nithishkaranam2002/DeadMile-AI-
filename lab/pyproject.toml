[project]
name = "dmlab"
version = "0.1.0"
description = "DeadMile AI pickup and delivery experiment lab"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.162,<1",
    "ijson>=3.3,<4",
    "langgraph==1.2.18",
    "litellm==1.106.6",
    "mlflow==3.17.2",
    "numpy>=2,<3",
    "ortools==9.15.6755",
    "pydantic>=2.14,<3",
    "pyvrp==0.14.1",
    "pyyaml>=6.0.3,<7",
    "qdrant-client==1.20.0",
    "scipy>=1.18,<2",
    "uvicorn[standard]>=0.54,<1",
    "vrplib==2.2.0",
]

[project.scripts]
dmlab-data = "dmlab.cli.data:main"
dmlab-route = "dmlab.cli.route:main"
dmlab-harness = "dmlab.cli.harness:main"

[dependency-groups]
dev = [
    "httpx>=0.28.1,<1",
    "pytest>=9.2,<10",
    "ruff>=0.17.3,<0.18",
]
# Local ML models: agent memory embeddings (Module 3) and Chronos 2 (Module 5a).
# Not installed in the lab-api image. Install with: uv sync --group ml
ml = [
    "sentence-transformers==6.2.0",
    "torch==2.15.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dmlab"]

[tool.uv]
# The lab only ever runs on a uv-managed CPython, never Anaconda or a stray venv.
python-preference = "only-managed"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
