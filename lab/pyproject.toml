[project]
name = "dmlab"
version = "0.1.0"
description = "DeadMile AI pickup and delivery experiment lab"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.162,<1",
    "mlflow==3.17.2",
    "pydantic>=2.14,<3",
    "pyyaml>=6.0.3,<7",
    "uvicorn[standard]>=0.54,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1,<1",
    "pytest>=9.2,<10",
    "ruff>=0.17.3,<0.18",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dmlab"]

[tool.uv]
# The lab only ever runs on a uv-managed CPython, never Anaconda or a stray venv.
python-preference = "only-managed"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
