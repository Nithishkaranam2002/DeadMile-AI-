suites:
  quick:
    # Validation subset used during agent iterations: 1 instance per Solomon
    # class and 2 per Amazon city, picked with the split seed.
    split: validation
    instances:
      - RouteID_309a335b-e1c6-4b40-8026-136bda97374b
      - RouteID_587876a2-40af-4843-b7cf-4bdff6ccb775
      - C104
      - C205
      - RouteID_35cfd8d0-1b27-4979-b757-068be94e0bc0
      - RouteID_dc0262d6-f3df-47b5-8276-c8f2942b6e4c
      - R101
      - R211
      - RC102
      - RC208
    seeds: [1, 2]
    time_limit_seconds: 5
  full:
    # All instances of a split (validation, or test for the gate only).
    seeds: [1, 2, 3, 4, 5]
    time_limit_seconds: 30
    # Second seed set, used only by the A/A self check (champion vs itself).
    aa_seeds: [6, 7, 8, 9, 10]

# Solvers without a seed (OR Tools, nearest neighbor) run once per instance,
# with the first seed of the suite logged as unused. Only seeded solvers run
# every seed.

statistics:
  # Bootstrap 95% CI of the median per instance relative improvement:
  # resample instances with replacement.
  bootstrap_resamples: 10000
  bootstrap_seed: 20261030
  ci_level: 0.95
  # A tie is an exactly equal seed averaged distance. Ties are dropped by the
  # Wilcoxon signed rank test (zero_method "wilcox") and counted separately.

slices:
  # Results are always reported per slice, not only overall.
  solomon_classes: [C1, C2, R1, R2, RC1, RC2]
  amazon_cities: [Boston, Chicago]
